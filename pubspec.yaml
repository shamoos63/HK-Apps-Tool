name: adbappmanager
description: HK Apps Tool — APK/XAPK install helper with ADB, store search, and device app management.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  path: ^1.9.1
  path_provider: ^2.1.5
  html: ^0.15.6
  archive: ^4.0.9
  collection: ^1.19.1
  shared_preferences: ^2.5.5
  file_selector: ^1.1.0
  synchronized: ^3.4.0+1
  desktop_drop: ^0.8.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - Logo.png

flutter_launcher_icons:
  image_path: Logo.png
  android: true
  ios: true
  web:
    generate: true
  windows:
    generate: true
  macos:
    generate: true
  linux:
    generate: true
